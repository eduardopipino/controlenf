{% extends "base.html" %}

{% block content %}
<div class="page-header-sticky">
    <h2>Utilitários - Número por Extenso</h2>
</div>

<div class="inner-container extenso-container">
    
    <div class="extenso-group">
        <label for="inputMoeda" class="extenso-label">Digite o valor financeiro (R$):</label>
        <input type="text" id="inputMoeda" class="extenso-input" placeholder="Ex: 1.234,56" autocomplete="off">
    </div>

    <div class="extenso-group">
        <label class="extenso-label">Valor por Extenso Oficial:</label>
        <div id="resultadoExtenso" class="extenso-resultado">
            <span class="extenso-resultado-vazio">aguardando valor...</span>
        </div>
    </div>

    <div class="button-toolbar extenso-toolbar">
        <!-- Nossos dois botões de copiar! Diferenciei as cores para melhor UX -->
        <button id="btnCopiarTexto" class="button extenso-btn-copiar" disabled>Copiar só texto</button>
        <button id="btnCopiarTudo" class="button extenso-btn-copiar" style="background-color: var(--tertiary-color);" disabled>Copiar Valor + Texto</button>
        
        <button id="btnLimpar" class="btn-cancel-modal extenso-btn-limpar">Limpar</button>
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const inputMoeda = document.getElementById('inputMoeda');
    const resultadoExtenso = document.getElementById('resultadoExtenso');
    
    // Nossos novos botões mapeados
    const btnCopiarTexto = document.getElementById('btnCopiarTexto');
    const btnCopiarTudo = document.getElementById('btnCopiarTudo');
    const btnLimpar = document.getElementById('btnLimpar');

    // 1. Aplica a Máscara Financeira (Sem converter ponto em vírgula)
    const currencyMask = IMask(inputMoeda, {
        mask: 'num',
        blocks: {
            num: {
                mask: Number,
                scale: 2,
                thousandsSeparator: '.',
                padFractionalZeros: true,
                normalizeZeros: true,
                radix: ',',
                mapToRadix: [], /* <<< O SEGREDO ESTÁ AQUI: Array vazio desativa o padrão de fábrica! */                max: 99999999999999.99
            }
        }
    });

    // 1.5 Filtro de Colagem Inteligente e Blindado
    inputMoeda.addEventListener('paste', function(e) {
        e.preventDefault();
        let textoColado = (e.clipboardData || window.clipboardData).getData('text');
        
        // 1. Tira os pontos de milhar e limpa tudo que não for número ou vírgula
        // Ex: "R$ 1.000,1" -> "1000,1"
        let textoLimpo = textoColado.replace(/\./g, '').replace(/[^0-9,]/g, '');
        
        // 2. Separa os reais (inteiros) dos centavos (decimais)
        let partes = textoLimpo.split(',');
        let inteiro = partes[0] || '0';
        let decimal = partes[1] || '';
        
        // 3. Força ter exatamente 2 casas decimais!
        // Se colar "1" -> vira "10". Se colar "100" -> corta para "10". 
        // Se não tiver decimal, padEnd preenche com "00".
        decimal = decimal.substring(0, 2).padEnd(2, '0');
        
        // 4. Monta o valor final estrito usando a VÍRGULA (o radix oficial do IMask)
        let valorFinal = inteiro + ',' + decimal;
        
        // 5. Entrega mastigado para a máscara
        currencyMask.unmaskedValue = valorFinal;
        
        // Atualiza a interface
        inputMoeda.dispatchEvent(new Event('input'));
        inputMoeda.dispatchEvent(new Event('blur')); 
    });

    function extensoBRL(valor) {
        if (!valor || valor === '0,00') return '';

        const unidades = ["", "um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove"];
        const dezenas = ["", "dez", "vinte", "trinta", "quarenta", "cinquenta", "sessenta", "setenta", "oitenta", "noventa"];
        const especiais = ["dez", "onze", "doze", "treze", "quatorze", "quinze", "dezesseis", "dezessete", "dezoito", "dezenove"];
        const centenas = ["", "cento", "duzentos", "trezentos", "quatrocentos", "quinhentos", "seiscentos", "setecentos", "oitocentos", "novecentos"];

        function converteBloco(n) {
            if (n === 0) return "";
            if (n === 100) return "cem";
            let c = Math.floor(n / 100);
            let d = Math.floor((n % 100) / 10);
            let u = n % 10;
            let res = [];
            
            if (c > 0) res.push(centenas[c]);
            if (d === 1) {
                res.push(especiais[u]);
            } else {
                if (d > 1) res.push(dezenas[d]);
                if (u > 0) res.push(unidades[u]);
            }
            return res.join(" e ");
        }

        let numStr = valor.replace(/\./g, '');
        let partes = numStr.split(',');
        let reais = parseInt(partes[0] || '0', 10);
        let centavosStr = (partes[1] || '0').padEnd(2, '0').substring(0, 2);
        let centavos = parseInt(centavosStr, 10);
        
        if (reais === 0 && centavos === 0) return '';

        let extensoFinal = [];

        if (reais > 0) {
            let blocos = [];
            let rStr = reais.toString();
            while (rStr.length > 0) {
                blocos.push(parseInt(rStr.slice(-3), 10));
                rStr = rStr.slice(0, -3);
            }

            const grandezasP = ["", "mil", "milhões", "bilhões", "trilhões"];
            const grandezasS = ["", "mil", "milhão", "bilhão", "trilhão"];
            let partesReais = [];

            for (let i = 0; i < blocos.length; i++) {
                let n = blocos[i];
                if (n === 0) continue;

                let blocoExtenso = converteBloco(n);
                
                if (i === 1 && n === 1) {
                    blocoExtenso = "mil";
                } else if (i > 0) {
                    blocoExtenso += " " + (n === 1 ? grandezasS[i] : grandezasP[i]);
                }

                partesReais.unshift({ valor: n, texto: blocoExtenso });
            }

            let stringReais = "";
            for (let i = 0; i < partesReais.length; i++) {
                if (i === 0) {
                    stringReais += partesReais[i].texto;
                } else {
                    let atual = partesReais[i].valor;
                    if (atual <= 100 || atual % 100 === 0) {
                        stringReais += " e " + partesReais[i].texto;
                    } else {
                        stringReais += " " + partesReais[i].texto;
                    }
                }
            }

            let moedaStr = reais === 1 ? "real" : "reais";
            
            // A MÁGICA: Mudar de "> 1" para "> 2" garante que o "de reais" só aplique para Milhões, Bilhões, etc.
            if (blocos.length > 2 && blocos[0] === 0) {
                let todasOutrasZeradas = blocos.slice(0, -1).every(b => b === 0);
                if (todasOutrasZeradas) moedaStr = "de reais";
            }

            extensoFinal.push(`${stringReais} ${moedaStr}`.trim());
        }

        if (centavos > 0) {
            let centavosStr = converteBloco(centavos);
            let moedaCentavosStr = centavos === 1 ? "centavo" : "centavos";
            extensoFinal.push(`${centavosStr} ${moedaCentavosStr}`);
        }

        return extensoFinal.join(" e ").toLowerCase();
    }

    inputMoeda.addEventListener('input', function() {
        const valDigitado = currencyMask.unmaskedValue;
        const formattedVal = currencyMask.value;
        
        if (valDigitado === '' || valDigitado === '0') {
            resultadoExtenso.innerHTML = '<span class="extenso-resultado-vazio">aguardando valor...</span>';
            btnCopiarTexto.disabled = true;
            btnCopiarTudo.disabled = true;
            return;
        }

        const texto = extensoBRL(formattedVal);
        resultadoExtenso.innerHTML = `<strong>${texto}</strong>`;
        
        // Libera ambos os botões para clique
        btnCopiarTexto.disabled = false;
        btnCopiarTudo.disabled = false;
    });

    inputMoeda.addEventListener('blur', function() {
        if (currencyMask.unmaskedValue !== '') {
            inputMoeda.value = currencyMask.value; 
            currencyMask.updateValue();
            inputMoeda.dispatchEvent(new Event('input'));
        }
    });

    // Função central para dar o efeito de "✔ copiado!" independentemente do botão clicado
    function animarBotaoCopiado(botaoClicado) {
        const textoOriginal = botaoClicado.textContent;
        const corOriginal = botaoClicado.style.backgroundColor;
        
        botaoClicado.textContent = "✔ copiado!";
        botaoClicado.style.backgroundColor = "#27ae60"; // Fica verde
        botaoClicado.style.color = "#ffffff";
        
        setTimeout(() => {
            botaoClicado.textContent = textoOriginal;
            botaoClicado.style.backgroundColor = corOriginal;
            botaoClicado.style.color = "";
        }, 2000);
    }

    // BOTÃO 1: Copia APENAS o texto (ex: "mil duzentos e trinta e quatro reais")
    btnCopiarTexto.addEventListener('click', function() {
        const textoParaCopiar = resultadoExtenso.innerText; 
        navigator.clipboard.writeText(textoParaCopiar).then(() => animarBotaoCopiado(btnCopiarTexto));
    });

    // BOTÃO 2: Copia NÚMERO + TEXTO (ex: "1.234,00 (mil duzentos e trinta e quatro reais)")
    btnCopiarTudo.addEventListener('click', function() {
        // Se a pessoa esqueceu de sair do campo e tem "1,2", o blur automático salva ela
        inputMoeda.dispatchEvent(new Event('blur')); 
        
        const textoExtenso = resultadoExtenso.innerText;
        const valorNumerico = currencyMask.value; // ex: 1.234,00
        
        // Opcional: Se quiser que ele adicione o R$, mude para: `R$ ${valorNumerico} (${textoExtenso})`
        const textoParaCopiar = `${valorNumerico} (${textoExtenso})`; 

        navigator.clipboard.writeText(textoParaCopiar).then(() => animarBotaoCopiado(btnCopiarTudo));
    });

    btnLimpar.addEventListener('click', function() {
        currencyMask.value = '';
        inputMoeda.dispatchEvent(new Event('input'));
        inputMoeda.focus();
    });

    btnLimpar.addEventListener('click', function() {
        currencyMask.value = '';
        inputMoeda.dispatchEvent(new Event('input'));
        inputMoeda.focus();
    });

    // NOVO: Atalho global da tecla ESC para limpar o campo
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            e.preventDefault(); // Evita que o ESC feche outras coisas do navegador sem querer
            btnLimpar.click();  // Simula o clique no botão Limpar
        }
    });

    setTimeout(() => inputMoeda.focus(), 100);
});

</script>
{% endblock %}
