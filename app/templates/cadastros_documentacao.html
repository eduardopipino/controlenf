{% extends "base.html" %}
{% block content %}
    <h2>Tipos de Documento</h2>
    <div class="button-toolbar desktop-actions">
        <button onclick="location.href='{{ url_for('cadastros.novo_tipo_documento') }}'">Novo</button>
    </div>

    <div class="mobile-actions">
        <a href="{{ url_for('cadastros.novo_tipo_documento') }}" class="fab" title="Novo Documento">+</a>
    </div>
    <br>

    <div class="table-responsive-wrapper wrapper-compacto">
        <table id="tabelaTiposDocumento" class="responsive-card-table">
            <thead>
                <tr>
                    <th class="text-center"></th>
                    <th class="text-left">Nome do Documento</th>
                </tr>
            </thead>
            <tbody>
                {% for doc in documentos %}
                <tr class="clickable-row" data-url="{{ url_for('cadastros.editar_tipo_documento', doc_id=doc._id) }}">
                    <td data-label="Ações" class="hide-on-mobile text-center">
                        <a href="{{ url_for('cadastros.editar_tipo_documento', doc_id=doc._id) }}" class="action-icon-link" title="Ver Detalhes">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="currentColor">
                                <path d="M0 0h24v24H0V0z" fill="none"/><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                            </svg>
                        </a>
                    </td>
                    <td data-label="Nome do Documento" class="text-left">
                        <span class="card-value">{{ doc.nome }}</span>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="2">Nenhum tipo de documento cadastrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}

{% block page_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Lógica para duplo clique (desktop) e clique simples (mobile) na linha da tabela
    document.querySelectorAll('#tabelaTiposDocumento .clickable-row[data-url]').forEach(row => {
        row.addEventListener('dblclick', function(e) {
            if (window.innerWidth > 768 && !e.target.closest('a, button, input')) {
                window.location.href = this.dataset.url;
            }
        });
        row.addEventListener('click', function(e) {
            if (window.innerWidth <= 768 && !e.target.closest('.action-icon-link, input')) {
                window.location.href = this.dataset.url;
            }
        });
    });
});
</script>
{% endblock %}
